<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-jobtrack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="card-grad-jt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c16" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="jt-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-jobtrack)" />
  
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" />
    <path d="M160 0 V500 M320 0 V500 M480 0 V500 M640 0 V500" />
  </g>

