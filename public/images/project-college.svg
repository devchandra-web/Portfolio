    <linearGradient id="college-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-college)" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
