<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#311b92" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-ai)" />

  <!-- App Window -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
  
  <rect x="40" y="40" width="720" height="44" rx="12" fill="#1e1b4b" />
  <circle cx="68" cy="62" r="6" fill="#ef4444" />
  <circle cx="88" cy="62" r="6" fill="#eab308" />
  <circle cx="108" cy="62" r="6" fill="#22c55e" />
  <text x="330" y="66" fill="#d8b4fe" font-family="sans-serif" font-weight="bold" font-size="12">CogniAI Workspace</text>

  <!-- Left Sidebar Chat History -->
  <rect x="56" y="96" width="160" height="350" rx="8" fill="#1e1b4b" fill-opacity="0.5" />
  <rect x="72" y="116" width="128" height="28" rx="6" fill="url(#ai-glow)" />
  <text x="96" y="134" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">+ New AI Chat</text>
  <rect x="72" y="160" width="110" height="8" rx="2" fill="#a855f7" fill-opacity="0.6" />
  <rect x="72" y="180" width="120" height="8" rx="2" fill="#64748b" />
  <rect x="72" y="200" width="90" height="8" rx="2" fill="#64748b" />

  <!-- Chat Output Stream Area -->
  <!-- User Message -->
  <rect x="520" y="110" width="220" height="44" rx="10" fill="#3b82f6" />
  <text x="535" y="136" fill="#ffffff" font-family="sans-serif" font-size="12">Refactor React component to TS...</text>

  <!-- AI Response Message -->
  <rect x="236" y="170" width="504" height="190" rx="10" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08" />
  <circle cx="260" cy="194" r="12" fill="#a855f7" />
  <text x="282" y="198" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="12">CogniAI Assistant</text>
  
  <text x="260" y="225" fill="#f8fafc" font-family="sans-serif" font-size="12">Here is the optimized TypeScript component using Next.js App Router:</text>

  <!-- Code Snippet Box -->
  <rect x="260" y="240" width="456" height="100" rx="6" fill="#090d16" />
  <text x="275" y="265" fill="#e2e8f0" font-family="monospace" font-size="11"><tspan fill="#f43f5e">export interface</tspan> <tspan fill="#38bdf8">Props</tspan> &#123; title: <tspan fill="#a855f7">string</tspan>; &#125;</text>
  <text x="275" y="285" fill="#e2e8f0" font-family="monospace" font-size="11"><tspan fill="#f43f5e">export function</tspan> <tspan fill="#22c55e">Hero</tspan>(&#123; title &#125;: <tspan fill="#38bdf8">Props</tspan>) &#123;</text>
  <text x="290" y="305" fill="#e2e8f0" font-family="monospace" font-size="11"><tspan fill="#f43f5e">return</tspan> &lt;<tspan fill="#38bdf8">h1</tspan> className=<tspan fill="#f59e0b">"text-3xl"</tspan>&gt;&#123;title&#125;&lt;/<tspan fill="#38bdf8">h1</tspan>&gt;;</text>
  <text x="275" y="325" fill="#e2e8f0" font-family="monospace" font-size="11">&#125;</text>

  <!-- Bottom Input Bar -->
  <rect x="236" y="380" width="504" height="44" rx="22" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" />
  <text x="260" y="407" fill="#94a3b8" font-family="sans-serif" font-size="12">Ask CogniAI anything or paste code...</text>
  <circle cx="716" cy="402" r="14" fill="url(#ai-glow)" />
  <path d="M712 402 L720 402 M717 398 L721 402 L717 406" stroke="#ffffff" stroke-width="2" fill="none" />
</svg>
