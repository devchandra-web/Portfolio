<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cashify" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cashify-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-cashify)" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" />
    <path d="M160 0 V500 M320 0 V500 M480 0 V500 M640 0 V500" />
  </g>

  <!-- Window Frame -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="url(#card-grad)" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5" />
  <rect x="40" y="40" width="720" height="44" rx="12" fill="#0f172a" />
  <circle cx="68" cy="62" r="6" fill="#ef4444" />
  <circle cx="88" cy="62" r="6" fill="#eab308" />
  <circle cx="108" cy="62" r="6" fill="#22c55e" />
  <rect x="220" y="52" width="360" height="20" rx="6" fill="#1e293b" />
  <text x="310" y="66" fill="#a5b4fc" font-family="monospace" font-size="11">https://github.com/cd6388881581/CashifyApplication</text>

  <!-- Cashify Dashboard Mockup -->
  <!-- Left Resale Product Form -->
  <rect x="64" y="104" width="220" height="330" rx="10" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-opacity="0.2" />
  <rect x="84" y="124" width="140" height="14" rx="4" fill="url(#cashify-accent)" />
  <text x="84" y="135" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">Resale Product Form</text>
  
  <rect x="84" y="156" width="180" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="94" y="172" fill="#94a3b8" font-family="sans-serif" font-size="10">Device Name (e.g. iPhone 13)</text>
  
  <rect x="84" y="192" width="180" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="94" y="208" fill="#94a3b8" font-family="sans-serif" font-size="10">Condition Grade (Like New)</text>
  
  <rect x="84" y="228" width="180" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="94" y="244" fill="#94a3b8" font-family="sans-serif" font-size="10">Resale Price (₹ 35,000)</text>

  <rect x="84" y="270" width="180" height="32" rx="6" fill="url(#cashify-accent)" />
  <text x="125" y="291" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">Submit Resale Item</text>

  <!-- Right Product Inventory Table -->
  <rect x="300" y="104" width="440" height="330" rx="10" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.08" />
  <rect x="316" y="120" width="408" height="36" rx="6" fill="#1e293b" />
  <text x="330" y="142" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="11">Resale Inventory Catalog (MVC CRUD)</text>
  
  <!-- Table rows -->
  <rect x="316" y="168" width="408" height="40" rx="6" fill="#1e1b4b" fill-opacity="0.4" />
  <circle cx="336" cy="188" r="10" fill="#6366f1" />
  <rect x="356" y="180" width="120" height="8" rx="2" fill="#f8fafc" />
  <rect x="356" y="192" width="80" height="6" rx="2" fill="#818cf8" />
  <rect x="640" y="178" width="68" height="20" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
  <text x="653" y="192" fill="#4ade80" font-family="sans-serif" font-size="10">Active</text>

  <rect x="316" y="216" width="408" height="40" rx="6" fill="#1e1b4b" fill-opacity="0.4" />
  <circle cx="336" cy="236" r="10" fill="#a855f7" />
  <rect x="356" y="228" width="140" height="8" rx="2" fill="#f8fafc" />
  <rect x="356" y="240" width="90" height="6" rx="2" fill="#c084fc" />
  <rect x="640" y="226" width="68" height="20" rx="4" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="1" />
  <text x="650" y="240" fill="#fde047" font-family="sans-serif" font-size="10">Pending</text>

  <rect x="316" y="264" width="408" height="40" rx="6" fill="#1e1b4b" fill-opacity="0.4" />
  <circle cx="336" cy="284" r="10" fill="#ec4899" />
  <rect x="356" y="276" width="110" height="8" rx="2" fill="#f8fafc" />
  <rect x="356" y="288" width="70" height="6" rx="2" fill="#f472b6" />
  <rect x="640" y="274" width="68" height="20" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
  <text x="653" y="288" fill="#4ade80" font-family="sans-serif" font-size="10">Sold</text>

  <!-- Floating Badge -->
  <rect x="540" y="340" width="170" height="40" rx="8" fill="url(#cashify-accent)" />
  <text x="555" y="365" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">Java | Servlet | MySQL</text>
</svg>
