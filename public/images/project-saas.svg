<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-saas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-saas)" />

  <!-- App Window -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
  
  <!-- Header bar -->
  <rect x="40" y="40" width="720" height="44" rx="12" fill="#1e293b" />
  <circle cx="68" cy="62" r="6" fill="#ef4444" />
  <circle cx="88" cy="62" r="6" fill="#eab308" />
  <circle cx="108" cy="62" r="6" fill="#22c55e" />
  <text x="310" y="66" fill="#06b6d4" font-family="sans-serif" font-weight="bold" font-size="12">SaaS Analytics Workspace</text>

  <!-- Sidebar -->
  <rect x="56" y="96" width="140" height="350" rx="8" fill="#1e293b" fill-opacity="0.4" />
  <rect x="72" y="116" width="108" height="10" rx="3" fill="#06b6d4" />
  <rect x="72" y="144" width="90" height="8" rx="2" fill="#64748b" />
  <rect x="72" y="166" width="100" height="8" rx="2" fill="#64748b" />
  <rect x="72" y="188" width="80" height="8" rx="2" fill="#64748b" />

  <!-- Metrics Grid -->
  <rect x="212" y="96" width="160" height="80" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="228" y="120" fill="#94a3b8" font-family="sans-serif" font-size="10">TOTAL REVENUE</text>
  <text x="228" y="146" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="20">$128,450</text>
  <text x="228" y="164" fill="#22c55e" font-family="sans-serif" font-size="10">↑ +14.2% vs last mo</text>

  <rect x="388" y="96" width="160" height="80" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="404" y="120" fill="#94a3b8" font-family="sans-serif" font-size="10">ACTIVE USERS</text>
  <text x="404" y="146" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="20">34,210</text>
  <text x="404" y="164" fill="#22c55e" font-family="sans-serif" font-size="10">↑ +8.4% vs last mo</text>

  <rect x="564" y="96" width="180" height="80" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="580" y="120" fill="#94a3b8" font-family="sans-serif" font-size="10">CONVERSION</text>
  <text x="580" y="146" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="20">4.85%</text>

  <!-- Large Area Chart -->
  <rect x="212" y="192" width="532" height="254" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
  <path d="M230 380 Q300 320, 380 340 T520 250 T650 280 T720 220 L720 420 H230 Z" fill="url(#chart-grad)" />
  <path d="M230 380 Q300 320, 380 340 T520 250 T650 280 T720 220" fill="none" stroke="#06b6d4" stroke-width="3" />
  
  <!-- Data Points -->
  <circle cx="520" cy="250" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  <circle cx="720" cy="220" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
</svg>
