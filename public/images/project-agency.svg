<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-agency" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-agency)" />

  <!-- App Window -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#090d16" fill-opacity="0.95" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
  
  <rect x="40" y="40" width="720" height="44" rx="12" fill="#0f172a" />
  <circle cx="68" cy="62" r="6" fill="#ef4444" />
  <circle cx="88" cy="62" r="6" fill="#eab308" />
  <circle cx="108" cy="62" r="6" fill="#22c55e" />
  <text x="320" y="66" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">Aethel Digital Agency</text>

  <!-- Hero Motion Canvas -->
  <text x="80" y="140" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="32">WE CRAFT MODERN</text>
  <text x="80" y="180" fill="url(#neon-glow)" font-family="sans-serif" font-weight="900" font-size="32">DIGITAL EXPERIENCES</text>

  <text x="80" y="210" fill="#94a3b8" font-family="sans-serif" font-size="14">Award-winning Next.js development and brand design studio.</text>

  <!-- Feature Cards Grid -->
  <rect x="80" y="250" width="180" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="120" cy="290" r="16" fill="#10b981" fill-opacity="0.3" />
  <text x="100" y="340" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">UI/UX Design</text>
  <rect x="100" y="355" width="120" height="6" rx="2" fill="#64748b" />
  <rect x="100" y="367" width="90" height="6" rx="2" fill="#475569" />

  <rect x="280" y="250" width="180" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="320" cy="290" r="16" fill="#06b6d4" fill-opacity="0.3" />
  <text x="300" y="340" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">Next.js Web</text>
  <rect x="300" y="355" width="120" height="6" rx="2" fill="#64748b" />
  <rect x="300" y="367" width="90" height="6" rx="2" fill="#475569" />

  <rect x="480" y="250" width="240" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.4" />
  <text x="500" y="290" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="14">Scroll Animations</text>
  <rect x="500" y="310" width="180" height="8" rx="2" fill="#3b82f6" fill-opacity="0.5" />
  <rect x="500" y="326" width="140" height="8" rx="2" fill="#3b82f6" fill-opacity="0.3" />
</svg>
